<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>홈 - AI 메뉴 추천</title>
    <script src="./api.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #0f172a;
        --muted: #62748e;
        --line: #e2e8f0;
        --coral: #ff6041;
        --surface: #ffffff;
        --bg-field: #f8fafc;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #61795f; font-family: "Noto Sans KR", sans-serif; -webkit-font-smoothing: antialiased; }
      body { display: grid; place-items: center; min-height: 100vh; min-height: 100dvh; color: var(--ink); }
      button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }

      .phone-shell {
        position: relative;
        width: min(100vw, 401px);
        height: min(100vh, 874px);
        min-height: 640px;
        overflow: hidden;
        background: var(--surface);
        box-shadow: 0 0 0 2px #68a6ff;
      }

      .header {
        height: 56px;
        padding: 11px 30px;
        display: flex;
        align-items: center;
        border-bottom: 1px solid #dedede;
        font-size: 18px;
        line-height: 28px;
        font-weight: 700;
        background: #fff;
      }

      .content {
        padding: 20px 30px 100px;
        overflow-y: auto;
        height: calc(100% - 120px);
      }

      h1 { margin: 0 0 10px; font-size: 24px; line-height: 30px; letter-spacing: 0.01em; font-weight: 700; }
      .intro { margin: 0 0 40px; font-size: 14px; color: #7f7a76; line-height: 19px; letter-spacing: 0.01em; }

      .action-card {
        width: 100%;
        min-height: 191px;
        margin: 0 0 16px;
        padding: 24px;
        display: flex;
        align-items: flex-start;
        text-align: left;
        border: 1px solid #d9dfe7;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 2px 3px rgba(15, 23, 43, 0.12);
        position: relative;
        transition: transform 0.16s ease, border-color 0.16s ease;
      }
      .action-card:active { transform: scale(0.99); }
      .action-card:hover { border-color: #94a3b8; }

      .card-icon {
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        border-radius: 16px;
      }
      .card-icon.coral { background: #171717; }
      .card-icon.pale { background: #f6f4f5; }
      .card-icon img { width: 23px; height: 23px; object-fit: contain; }
      .card-icon.pale img { width: 20px; height: 20px; }

      .card-copy { display: grid; gap: 4px; position: absolute; left: 24px; bottom: 25px; }
      .card-copy strong { color: #171717; font-size: 18px; line-height: 28px; font-weight: 700; letter-spacing: 0.01em; }
      .card-copy small { color: #7f7a76; font-size: 14px; line-height: 19px; letter-spacing: 0.01em; }

      .chevron { display: grid; place-items: center; color: #b2afac; position: absolute; right: 23px; top: 86px; }
      .chevron svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .badge { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 13px; color: #314158; background: #f6f4f5; font-size: 12px; font-weight: 700; position: absolute; right: 44px; top: 84px; }

      /* 하단 탭 메뉴 */
      .bottom-nav {
        position: absolute;
        bottom: 10px;
        left: 10px;
        right: 10px;
        height: 63px;
        padding: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-radius: 154px;
        background: #fff;
        box-shadow: 0 4px 4px rgba(0, 0, 0, 0.18);
      }
      .nav-item {
        position: relative;
        width: 183px;
        height: 47px;
        border: 0;
        background: transparent;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        color: #afa8a8;
        z-index: 1;
      }
      .nav-item.selected { color: #fff; }
      .nav-item.selected::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        border-radius: 32px;
        background: var(--coral);
      }
      .nav-item img { width: 18px; height: 18px; object-fit: contain; }
      .nav-item small { font-size: 10px; line-height: 15px; font-weight: 500; }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 85px;
        transform: translate(-50%, 15px);
        padding: 10px 16px;
        border-radius: 10px;
        background: #182235;
        color: #fff;
        opacity: 0;
        pointer-events: none;
        font-size: 12px;
        transition: opacity 0.2s ease, transform 0.2s ease;
        z-index: 300;
        white-space: nowrap;
      }
      .toast.show { opacity: 1; transform: translate(-50%, 0); }

      @media (max-width: 401px) {
        body { place-items: stretch; background: #fff; }
        .phone-shell { width: 100vw; height: 100vh; min-height: 600px; box-shadow: none; }
      }
    </style>
  </head>
  <body>
    <main class="phone-shell">
      <header class="header">홈</header>

      <div class="content">
        <h1>무엇을 도와드릴까요?</h1>
        <p class="intro">새로운 맞춤 추천을 받거나,<br />진행 중인 추천을 이어서 확인하세요.</p>

        <button class="action-card" id="btn-start" type="button">
          <span class="card-icon coral" aria-hidden="true"><img src="assets/wand-magic.png" alt="" /></span>
          <span class="card-copy">
            <strong>새 추천 시작</strong>
            <small>취향을 알려주시면<br />최적의 메뉴 조합을 찾아드려요</small>
          </span>
          <span class="chevron" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></span>
        </button>

        <button class="action-card" id="btn-continue" type="button">
          <span class="card-icon pale" aria-hidden="true"><img src="assets/clipboard-list.png" alt="" /></span>
          <span class="card-copy">
            <strong>진행 중인 추천</strong>
            <small id="continue-sub">1개의 추천이<br />진행 중입니다</small>
          </span>
          <span class="badge" id="continue-badge">1</span>
          <span class="chevron" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></span>
        </button>
      </div>

      <!-- 하단 탐색 바 -->
      <nav class="bottom-nav" aria-label="주요 메뉴">
        <button class="nav-item selected" id="nav-home" type="button">
          <img src="assets/nav-home.png" alt="" />
          <small>홈</small>
        </button>
        <button class="nav-item" id="nav-history" type="button">
          <img src="assets/nav-history.png" alt="" />
          <small>히스토리</small>
        </button>
      </nav>
    </main>

    <div id="toast" role="status" aria-live="polite"></div>

    <script>
      const toast = document.querySelector('#toast');
      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 1800);
      }

      document.querySelector('#btn-start').addEventListener('click', () => {
        window.location.href = 'STEP1_qr.html';
      });

      document.querySelector('#btn-continue').addEventListener('click', async () => {
        const storedResult = sessionStorage.getItem('aiResult');
        if (storedResult) {
          window.location.href = 'STEP8_result.html';
        } else {
          const detail = await getRecommendationDetail();
          if (detail) {
            window.location.href = 'STEP8_result.html';
          } else {
            showToast('진행 중인 추천 내역이 없습니다.');
          }
        }
      });

      document.querySelector('#nav-home').addEventListener('click', () => {
        window.location.href = 'STEP0_home.html';
      });

      document.querySelector('#nav-history').addEventListener('click', () => {
        window.location.href = 'STEP10_history.html';
      });
    </script>
  </body>
</html>
