<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>QR 스캔 - AI 메뉴 추천</title>
    <script src="./api.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #0f172a;
        --muted: #62748e;
        --line: #e2e8f0;
        --coral: #ff6041;
        --surface: #ffffff;
        --field: #f6f4f5;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #61795f; font-family: "Noto Sans KR", sans-serif; -webkit-font-smoothing: antialiased; }
      body { display: grid; place-items: center; min-height: 100vh; min-height: 100dvh; color: var(--ink); }
      button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }

      .phone-shell {
        position: relative;
        width: min(100vw, 401px);
        height: min(100vh, 874px);
        min-height: 640px;
        overflow: hidden;
        background: var(--surface);
        box-shadow: 0 0 0 2px #68a6ff;
      }

      .scan-header {
        height: 56px;
        padding: 11px 20px;
        display: flex;
        align-items: center;
        gap: 16px;
        border-bottom: 1px solid #eef1f5;
        font-size: 18px;
        font-weight: 700;
        background: #fff;
      }
      .scan-header button { border: 0; padding: 0; background: transparent; font-size: 28px; line-height: 1; color: var(--ink); }

      .progress { height: 4px; padding: 0 30px; display: flex; gap: 8px; margin-top: 16px; }
      .progress i { height: 4px; flex: 1; background: #f1f5f9; border-radius: 4px; }
      .progress i.current { background: var(--coral); }

      .scan-content { padding: 32px 24px 100px; height: calc(100% - 100px); overflow-y: auto; }

      .scanner {
        position: relative;
        height: 300px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        border-radius: 24px;
        background: var(--field);
      }
      .scanner strong { margin-top: 10px; font-size: 16px; line-height: 24px; letter-spacing: -0.5px; }
      .scanner small { color: #62748e; text-align: center; font-size: 12px; line-height: 18px; }
      .qr-icon { display: grid; place-items: center; width: 72px; height: 72px; border-radius: 50%; background: #fff; box-shadow: 0 2px 3px rgba(0,0,0,0.12); }
      .qr-icon svg { width: 32px; height: 32px; fill: var(--ink); }
      
      .corner { position: absolute; width: 50px; height: 50px; border-color: #000; }
      .tl { top: 20px; left: 20px; border-top: 2px solid; border-left: 2px solid; border-radius: 12px 0 0; }
      .tr { top: 20px; right: 20px; border-top: 2px solid; border-right: 2px solid; border-radius: 0 12px 0 0; }
      .bl { bottom: 20px; left: 20px; border-bottom: 2px solid; border-left: 2px solid; border-radius: 0 0 0 12px; }
      .br { right: 20px; bottom: 20px; border-bottom: 2px solid; border-right: 2px solid; border-radius: 0 0 12px; }

      .option-row, .code-row {
        width: 100%;
        min-height: 70px;
        margin-top: 20px;
        padding: 14px 18px;
        display: flex;
        align-items: center;
        border: 1px solid #dce4ef;
        border-radius: 16px;
        background: #fff;
        text-align: left;
      }
      .option-icon { display: grid; place-items: center; width: 40px; height: 40px; margin-right: 12px; border-radius: 12px; background: #f6f4f5; color: #314158; }
      .option-icon svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .option-copy, .code-copy { display: grid; gap: 2px; flex: 1; }
      .option-copy strong, .code-copy strong { font-size: 14px; font-weight: 700; }
      .option-copy small, .code-copy small { color: #62748e; font-size: 12px; }
      .option-row button { width: 52px; height: 32px; border: 1px solid #e2e8f0; border-radius: 8px; background: #fff; font-size: 12px; font-weight: 700; }

      .code-row { margin-top: 12px; cursor: pointer; }
      .code-row b { font-size: 12px; font-weight: 700; white-space: nowrap; color: var(--ink); }

      .scan-button {
        width: 100%;
        height: 52px;
        margin-top: 40px;
        border: 0;
        border-radius: 12px;
        background: var(--coral);
        color: #fff;
        font-size: 16px;
        font-weight: 700;
        box-shadow: 0 4px 6px rgba(255, 96, 65, 0.25);
      }

      /* 하단 탭 */
      .bottom-nav {
        position: absolute;
        bottom: 10px;
        left: 10px;
        right: 10px;
        height: 63px;
        padding: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-radius: 154px;
        background: #fff;
        box-shadow: 0 4px 4px rgba(0, 0, 0, 0.18);
      }
      .nav-item {
        position: relative;
        width: 183px;
        height: 47px;
        border: 0;
        background: transparent;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        color: #afa8a8;
        z-index: 1;
      }
      .nav-item.selected { color: #fff; }
      .nav-item.selected::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        border-radius: 32px;
        background: var(--coral);
      }
      .nav-item img { width: 18px; height: 18px; object-fit: contain; }
      .nav-item small { font-size: 10px; line-height: 15px; font-weight: 500; }

      /* 모달 스타일 */
      .modal-overlay {
        position: absolute;
        inset: 0;
        z-index: 200;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: rgba(15, 23, 42, 0.82);
        backdrop-filter: blur(4px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
      }
      .modal-overlay.active { opacity: 1; pointer-events: auto; }

      /* 카메라 모달 */
      .camera-box {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        background: #0f172a;
        color: #fff;
        border-radius: 20px;
        overflow: hidden;
      }
      .camera-head {
        height: 54px;
        padding: 0 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-weight: 700;
        border-bottom: 1px solid rgba(255,255,255,0.12);
      }
      .camera-head button { border: 0; background: transparent; color: #fff; font-size: 28px; }
      .camera-body {
        position: relative;
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
      }
      .camera-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .scanner-frame {
        position: relative;
        width: 200px;
        height: 200px;
        z-index: 2;
        box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6);
        border-radius: 16px;
      }
      .scan-laser {
        position: absolute;
        top: 10px; left: 10px; right: 10px;
        height: 3px;
        background: var(--coral);
        box-shadow: 0 0 10px var(--coral);
        border-radius: 2px;
        animation: scanAnim 2s ease-in-out infinite alternate;
      }
      @keyframes scanAnim { 0% { top: 10px; } 100% { top: 180px; } }

      .camera-foot { padding: 16px 20px; background: #0f172a; }
      .camera-btn { width: 100%; height: 48px; border: 0; border-radius: 12px; background: var(--coral); color: #fff; font-weight: 700; font-size: 14px; }

      /* 코드 입력 모달 */
      .code-card {
        width: min(100%, 330px);
        padding: 24px;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 20px 25px -5px rgba(0,0,0,0.25);
      }
      .code-card h3 { margin: 0 0 6px; font-size: 18px; font-weight: 700; color: var(--ink); }
      .code-card p { margin: 0 0 16px; color: #62748e; font-size: 13px; }
      .code-input {
        width: 100%;
        height: 50px;
        padding: 0 16px;
        border: 1px solid #dce4ef;
        border-radius: 14px;
        background: #f8fafc;
        font: 600 15px "Noto Sans KR", sans-serif;
        color: var(--ink);
      }
      .code-actions { display: flex; gap: 8px; margin-top: 20px; }
      .code-actions button { flex: 1; height: 44px; border: 1px solid #dce4ef; border-radius: 12px; background: #fff; color: #62748e; font-size: 14px; font-weight: 600; }
      .code-actions button.primary { border: 0; background: var(--coral); color: #fff; font-weight: 700; }

      .toast {
        position: fixed; left: 50%; bottom: 85px; transform: translate(-50%, 15px);
        padding: 10px 16px; border-radius: 10px; background: #182235; color: #fff;
        opacity: 0; pointer-events: none; font-size: 12px; transition: 0.2s; z-index: 300; white-space: nowrap;
      }
      .toast.show { opacity: 1; transform: translate(-50%, 0); }

      @media (max-width: 401px) {
        body { place-items: stretch; background: #fff; }
        .phone-shell { width: 100vw; height: 100vh; min-height: 600px; box-shadow: none; }
      }
    </style>
  </head>
  <body>
    <main class="phone-shell">
      <header class="scan-header">
        <button id="btn-back" aria-label="뒤로 가기">‹</button>
        <span>QR 스캔</span>
      </header>

      <div class="progress" aria-hidden="true">
        <i class="current"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      </div>

      <div class="scan-content">
        <div class="scanner">
          <span class="corner tl"></span><span class="corner tr"></span>
          <span class="corner bl"></span><span class="corner br"></span>
          <div class="qr-icon" aria-hidden="true">
            <img src="assets/qr-scan.svg" alt="" />
          </div>
          <strong>QR 코드를 스캔해 주세요</strong>
          <small>QR 코드를<br />카메라에 비춰주세요</small>
        </div>

        <div class="option-row">
          <span class="option-icon" aria-hidden="true">
            <img src="assets/camera-gray.png" alt="" width="16" height="14"/>
          </span>
          <span class="option-copy">
            <strong>카메라 권한이 필요해요</strong>
            <small>원활한 스캔을 위해 카메라를 켜주세요</small>
          </span>
          <button type="button" id="btn-permission">설정</button>
        </div>

        <button class="code-row" id="btn-open-code-modal" type="button">
          <span class="code-copy">
            <strong>코드로 직접 입력</strong>
            <small>QR이 잘 보이지 않을 때</small>
          </span>
          <b>
            입력하기
            <img src="assets/arrow-right.svg" alt="이동" class="icon-arrow" />
          </b>
        </button>
        <button class="scan-button" id="btn-start-camera" type="button">
          <b>
            스캔 시작하기
            <img src="assets/camera-white.png" alt="" width="16" height="14"/>
          </b>
        </button>
      </div>

      <!-- 카메라 스캐너 모달 -->
      <div id="camera-modal" class="modal-overlay" aria-hidden="true">
        <div class="camera-box">
          <header class="camera-head">
            <span>📷 QR 코드 스캔 중</span>
            <button id="btn-close-camera" type="button">×</button>
          </header>
          <div class="camera-body">
            <video id="camera-video" autoplay playsinline muted></video>
            <div class="scanner-frame">
              <span class="corner tl"></span><span class="corner tr"></span>
              <span class="corner bl"></span><span class="corner br"></span>
              <div class="scan-laser"></div>
            </div>
          </div>
          <div class="camera-foot">
            <button id="btn-finish-scan" class="camera-btn" type="button">QR 스캔 완료 (자동 감지)</button>
          </div>
        </div>
      </div>

      <!-- 코드 직접 입력 모달 -->
      <div id="code-modal" class="modal-overlay" aria-hidden="true">
        <div class="code-card">
          <h3>코드로 직접 입력</h3>
          <p>QR이 잘 보이지 않을 때 식별 코드를 입력해 주세요.</p>
          <input id="input-qr-code" class="code-input" type="text" placeholder="예: TABLE-101" autocomplete="off" />
          <div class="code-actions">
            <button id="btn-close-code" type="button">취소</button>
            <button id="btn-submit-code" type="button" class="primary">확인 및 스캔</button>
          </div>
        </div>
      </div>

      <!-- 하단 탐색 바 -->
      <nav class="bottom-nav" aria-label="주요 메뉴">
        <button class="nav-item selected" id="nav-home" type="button">
          <img src="assets/nav-home.png" alt="" />
          <small>홈</small>
        </button>
        <button class="nav-item" id="nav-history" type="button">
          <img src="assets/nav-history.png" alt="" />
          <small>히스토리</small>
        </button>
      </nav>
    </main>

    <div id="toast" role="status" aria-live="polite"></div>

    <script>
      const toast = document.querySelector('#toast');
      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 1800);
      }

      document.querySelector('#btn-back').addEventListener('click', () => {
        window.location.href = 'STEP0_home.html';
      });

      document.querySelector('#btn-permission').addEventListener('click', async () => {
        try {
          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            stream.getTracks().forEach(t => t.stop());
            showToast('카메라 권한이 허용되었습니다.');
          } else {
            showToast('카메라 권한 설정을 확인해 주세요.');
          }
        } catch(e) {
          showToast('카메라 권한 설정을 확인해 주세요.');
        }
      });

      // 카메라 스캐너 제어
      const cameraModal = document.querySelector('#camera-modal');
      const cameraVideo = document.querySelector('#camera-video');
      let cameraStream = null;

      document.querySelector('#btn-start-camera').addEventListener('click', async () => {
        cameraModal.classList.add('active');
        try {
          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            cameraVideo.srcObject = cameraStream;
          }
        } catch(e) { console.warn(e); }
      });

      function closeCamera() {
        cameraModal.classList.remove('active');
        if (cameraStream) {
          cameraStream.getTracks().forEach(t => t.stop());
          cameraStream = null;
        }
      }
      document.querySelector('#btn-close-camera').addEventListener('click', closeCamera);

      async function completeScan(qrUrl) {
        closeCamera();
        showToast('QR 코드 스캔 완료! 백엔드 전달 중...');
        const menuData = await scanQrMenu(qrUrl);
        if (menuData) {
          showToast(`[${menuData.restaurantName || '메뉴판'}] 정보를 로드했습니다.`);
        }
        setTimeout(() => {
          window.location.href = 'STEP2_personnel.html';
        }, 500);
      }

      document.querySelector('#btn-finish-scan').addEventListener('click', () => {
        completeScan('https://menu.example.com/table/1');
      });

      // 코드 직접 입력 모달 제어
      const codeModal = document.querySelector('#code-modal');
      const codeInput = document.querySelector('#input-qr-code');

      document.querySelector('#btn-open-code-modal').addEventListener('click', () => {
        codeModal.classList.add('active');
        codeInput.value = '';
        codeInput.focus();
      });

      function closeCodeModal() {
        codeModal.classList.remove('active');
      }
      document.querySelector('#btn-close-code').addEventListener('click', closeCodeModal);

      document.querySelector('#btn-submit-code').addEventListener('click', async () => {
        const code = codeInput.value.trim() || 'TABLE-101';
        closeCodeModal();
        showToast(`코드 [${code}] 스캔 전송 중...`);
        const menuData = await scanQrMenu(`https://menu.example.com/table/${code}`);
        if (menuData) {
          showToast(`[${menuData.restaurantName || '메뉴판'}] 정보를 로드했습니다.`);
        }
        setTimeout(() => {
          window.location.href = 'STEP2_personnel.html';
        }, 500);
      });

      document.querySelector('#nav-home').addEventListener('click', () => window.location.href = 'STEP0_home.html');
      document.querySelector('#nav-history').addEventListener('click', () => window.location.href = 'STEP10_history.html');
    </script>
  </body>
</html>
