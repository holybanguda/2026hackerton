<!doctype html>
<html lang="ko">
  <head>
    <script src="./api.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AI 메뉴 분석</title>
    <style>
      :root {
        --ink: #0f172b;
        --accent: #ff6041;
        --warm-gray: #7f7a76;
        --middle-gray: #b2afac;
        --line: #dedede;
        --field: #f6f4f5;
        --white: #ffffff;
      }

      * { box-sizing: border-box; }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        place-items: start center;
        background: #eef2f7;
        color: var(--ink);
        font-family: Inter, Pretendard, "Noto Sans KR", -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      button {
        font: inherit;
        -webkit-tap-highlight-color: transparent;
      }

      .app {
        position: relative;
        width: min(100%, 402px);
        min-height: 874px;
        overflow: hidden;
        background: var(--white);
      }

      .header {
        position: absolute;
        z-index: 4;
        inset: 0 0 auto;
        height: 56px;
        display: flex;
        align-items: center;
        padding: 0 20px;
        border-bottom: 1px solid var(--line);
        background: var(--white);
      }

      .back-button {
        width: 32px;
        height: 32px;
        display: grid;
        flex: 0 0 auto;
        place-items: center;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: transparent;
        cursor: pointer;
      }

      .back-button:hover,
      .back-button:focus-visible { background: var(--field); }

      .back-button img {
        display: block;
        width: 11px;
        height: 11px;
      }

      .header h1 {
        margin: 0 0 0 12px;
        font-size: 18px;
        font-weight: 700;
        line-height: 28px;
        letter-spacing: 0.01em;
      }

      main {
        position: absolute;
        top: 69px;
        left: 6px;
        width: 390px;
        height: 497px;
      }

      .analysis-visual {
        position: absolute;
        top: 30px;
        left: 99px;
        width: 192px;
        height: 192px;
        border: 4px solid rgba(255, 96, 65, 0.18);
        border-radius: 50%;
        box-shadow: 0 0 0 8px rgba(255, 96, 65, 0.04);
      }

      .analysis-visual::before {
        content: "";
        position: absolute;
        inset: -4px;
        border: 4px solid transparent;
        border-top-color: var(--accent);
        border-right-color: var(--accent);
        border-radius: 50%;
        animation: analysis-ring-spin 1.15s linear infinite;
      }

      .analysis-visual::after {
        content: "";
        position: absolute;
        top: 12px;
        right: 24px;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 5px rgba(255, 96, 65, 0.14);
        animation: loading-dot-pulse 1.15s ease-in-out infinite;
      }

      .visual-halo {
        position: absolute;
        top: 28px;
        left: 28px;
        width: 128px;
        height: 128px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--field);
        animation: halo-pulse 1.8s ease-in-out infinite;
      }

      .visual-halo img {
        display: block;
        width: 41px;
        height: 37px;
        animation: wand-float 1.8s ease-in-out infinite;
      }

      .status-copy {
        position: absolute;
        top: 248px;
        left: 65px;
        width: 260px;
        height: 89px;
        text-align: center;
      }

      .analysis-title {
        height: 28px;
        margin: 0;
        font-size: 20px;
        font-weight: 700;
        line-height: 28px;
        letter-spacing: 0.01em;
        white-space: nowrap;
      }

      .analysis-description {
        margin: 12px 0 0;
        color: var(--warm-gray);
        font-size: 14px;
        font-weight: 400;
        line-height: 21px;
        letter-spacing: 0.01em;
      }

      .progress-list {
        position: absolute;
        top: 377px;
        left: 55px;
        width: 280px;
        height: 128px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .progress-item {
        position: absolute;
        left: 0;
        width: 280px;
        height: 20px;
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--ink);
        font-size: 14px;
        font-weight: 500;
        line-height: 20px;
        letter-spacing: 0.01em;
        white-space: nowrap;
      }

      .progress-item:nth-child(1) { top: 0; }
      .progress-item:nth-child(2) { top: 36px; }
      .progress-item:nth-child(3) { top: 72px; }
      .progress-item:nth-child(4) { top: 108px; }

      .progress-item.is-active {
        font-weight: 700;
        animation: active-copy-pulse 1.4s ease-in-out infinite;
      }

      .progress-item.is-pending {
        color: var(--middle-gray);
        opacity: 0.4;
      }

      .progress-icon {
        width: 20px;
        height: 20px;
        display: grid;
        flex: 0 0 20px;
        place-items: center;
        border: 2px solid var(--line);
        border-radius: 50%;
        background: var(--white);
      }

      .is-complete .progress-icon {
        border: 0;
        background: var(--accent);
      }

      .is-complete .progress-icon img {
        display: block;
        width: 9px;
        height: 11px;
      }

      .progress-spinner {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 3px rgba(255, 96, 65, 0.16);
        animation: loading-dot-pulse 0.9s ease-in-out infinite;
      }

      .is-pending .progress-icon { border-color: #e2e8f0; }

      @keyframes analysis-ring-spin {
        to { transform: rotate(360deg); }
      }

      @keyframes halo-pulse {
        0%, 100% {
          transform: scale(0.96);
          box-shadow: 0 0 0 0 rgba(255, 96, 65, 0.16);
        }
        50% {
          transform: scale(1.03);
          box-shadow: 0 0 0 14px rgba(255, 96, 65, 0);
        }
      }

      @keyframes wand-float {
        0%, 100% { transform: translateY(2px) rotate(-3deg); }
        50% { transform: translateY(-4px) rotate(3deg); }
      }

      @keyframes loading-dot-pulse {
        0%, 100% { opacity: 0.45; transform: scale(0.75); }
        50% { opacity: 1; transform: scale(1); }
      }

      @keyframes active-copy-pulse {
        0%, 100% { opacity: 0.62; }
        50% { opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        .analysis-visual::before,
        .analysis-visual::after,
        .visual-halo,
        .visual-halo img,
        .progress-item.is-active,
        .progress-spinner {
          animation: none;
        }
      }

      .info-card {
        position: absolute;
        top: 639px;
        left: 30px;
        width: 342px;
        height: 74px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--white);
      }

      .info-icon-box {
        position: absolute;
        top: 16px;
        left: 16px;
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        background: var(--field);
      }

      .info-icon-box img {
        display: block;
        width: 16px;
        height: 16px;
      }

      .wait-copy {
        position: absolute;
        top: 19px;
        left: 68px;
        height: 33px;
      }

      .wait-copy strong,
      .wait-copy span {
        display: block;
        white-space: nowrap;
      }

      .wait-copy strong {
        font-size: 12px;
        font-weight: 700;
        line-height: 16px;
        letter-spacing: 0.01em;
      }

      .wait-copy span {
        color: var(--middle-gray);
        font-size: 11px;
        font-weight: 400;
        line-height: 16.5px;
        letter-spacing: 0.01em;
      }

      .cancel-button[hidden] { display: none !important; }

      .back-button:focus-visible {
        outline: 3px solid rgba(255, 96, 65, 0.24);
        outline-offset: 2px;
      }

      @media (max-width: 401px) {
        main {
          left: 0;
          width: 100%;
        }

        .analysis-visual,
        .status-copy,
        .progress-list {
          left: 50%;
          transform: translateX(-50%);
        }

        .info-card {
          left: 30px;
          width: calc(100% - 60px);
        }
      }

      @media (min-height: 874px) {
        .app { height: 874px; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <button class="back-button" type="button" aria-label="이전 화면으로">
          <img src="./assets/icon-xmark.svg" alt="" aria-hidden="true" />
        </button>
        <h1>AI 메뉴 분석</h1>
      </header>

      <main aria-labelledby="analysis-title">
        <div class="analysis-visual" aria-hidden="true">
          <span class="visual-halo">
            <img src="./assets/analysis-wand.svg" alt="" />
          </span>
        </div>

        <div class="status-copy">
          <h2 class="analysis-title" id="analysis-title">최적의 조합을 구성하고 있어요</h2>
          <p class="analysis-description">
            입력하신 조건을 분석하여<br />
            가장 만족스러운 구성을 제안해 드릴게요.
          </p>
        </div>

        <ol class="progress-list" aria-label="AI 메뉴 분석 진행 상황">
          <li class="progress-item is-complete">
            <span class="progress-icon" aria-hidden="true">
              <img src="./assets/analysis-check.svg" alt="" />
            </span>
            <span>QR코드 스캔 완료</span>
          </li>
          <li class="progress-item is-complete">
            <span class="progress-icon" aria-hidden="true">
              <img src="./assets/analysis-check.svg" alt="" />
            </span>
            <span id="condition-summary">인원 및 예산 조건 확인</span>
          </li>
          <li class="progress-item is-active" aria-current="step">
            <span class="progress-icon" aria-hidden="true">
              <span class="progress-spinner"></span>
            </span>
            <span id="meeting-type-summary">모임 유형 분석 중...</span>
          </li>
          <li class="progress-item is-pending">
            <span class="progress-icon" aria-hidden="true"></span>
            <span>최종 리포트 생성</span>
          </li>
        </ol>
      </main>

      <aside class="info-card" aria-label="분석 소요 시간 안내">
        <span class="info-icon-box" aria-hidden="true">
          <img src="./assets/analysis-info.svg" alt="" />
        </span>
        <div class="wait-copy" role="status" aria-live="polite">
          <strong>잠시만 기다려 주세요</strong>
          <span>보통 5~10초 이내에 완료됩니다.</span>
        </div>
      </aside>

      <button class="cancel-button" id="cancel-button" type="button" hidden>분석 취소하기</button>
    </div>

    <script>
      const conditionSummary = document.querySelector("#condition-summary");
      const meetingTypeSummary = document.querySelector("#meeting-type-summary");

      try {
        const recommendationRequest = JSON.parse(
          sessionStorage.getItem("recommendationRequest") || "null"
        );

        if (recommendationRequest) {
          const { peopleCount, budget, meetingType } = recommendationRequest;
          conditionSummary.textContent = `인원 및 예산 조건 확인 (${peopleCount}명, ${Number(budget).toLocaleString("ko-KR")}원)`;
          meetingTypeSummary.textContent = `'${meetingType}' 컨셉 분석 중...`;
        }
      } catch (error) {
        console.warn("Invalid recommendationRequest session data", error);
      }

      function returnToPreviousStep() {
        window.location.href = "STEP6_point.html";
      }

      

      document.querySelector(".back-button").addEventListener("click", returnToPreviousStep);
      document.querySelector("#cancel-button").addEventListener("click", returnToPreviousStep);

      // API 요청
      window.addEventListener("DOMContentLoaded", async () => {
        const recommendationRequest = sessionStorage.getItem("recommendationRequest");
        
        console.log("백엔드로 보낼 요청 데이터:", recommendationRequest);

        if (!recommendationRequest) {
            console.warn("저장된 추천 요청 데이터가 없습니다.");
            return;
        }

        try {
            const response = await fetch("http://localhost:8080/api/recommendation", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: recommendationRequest
            });

            if (!response.ok) {
                throw new Error(`API 오류: ${response.status}`);
            }

            const aiResult = await response.json();
            console.log("백엔드 AI 추천 결과 수신 성공:", aiResult);

            sessionStorage.setItem("aiResult", JSON.stringify(aiResult));

            window.location.href = "STEP8_result.html";

        } catch (error) {
            console.error("🚨 AI 추천 API 통신 실패:", error);
        }
    });

    </script>
  </body>
</html>
