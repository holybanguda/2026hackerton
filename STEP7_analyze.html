<!doctype html>
<html lang="ko">
  <head>
    <script src="./api.js"></script>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>AI 메뉴 분석</title>
    <style>
      :root {
        --ink: #0f172a;
        --text: #314158;
        --muted: #62748e;
        --faint: #90a1b9;
        --line: #e2e8f0;
        --line-soft: #f1f5f9;
        --field: #f8fafc;
        --white: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        place-items: start center;
        background: #eef2f7;
        color: var(--ink);
        font-family: Inter, Pretendard, "Noto Sans KR", -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      button {
        font: inherit;
        -webkit-tap-highlight-color: transparent;
      }

      .app {
        position: relative;
        width: min(100%, 390px);
        min-height: 878px;
        overflow: hidden;
        background: var(--white);
      }

      .header {
        position: absolute;
        z-index: 4;
        inset: 0 0 auto;
        height: 56px;
        display: flex;
        align-items: center;
        padding: 0 16px;
        border-bottom: 1px solid var(--line-soft);
        background: var(--white);
      }

      .back-button {
        width: 32px;
        height: 32px;
        display: grid;
        flex: 0 0 auto;
        place-items: center;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: var(--ink);
        cursor: pointer;
      }

      .back-button:hover,
      .back-button:focus-visible {
        background: var(--field);
      }

      .header h1 {
        margin: 0 0 0 12px;
        font-size: 18px;
        font-weight: 700;
        line-height: 28px;
        letter-spacing: 0.01em;
      }

      main {
        position: absolute;
        inset: 56px 0 64px;
        overflow: hidden;
      }

      .analysis-visual {
        position: absolute;
        top: 38px;
        left: 50%;
        width: 136px;
        height: 136px;
        transform: translateX(-50%);
      }

      .orbit,
      .orbit::before,
      .orbit::after {
        position: absolute;
        border-radius: 50%;
        content: "";
      }

      .orbit {
        inset: 5px;
        border: 1px solid var(--line);
        animation: rotate 8s linear infinite;
      }

      .orbit::before {
        top: -5px;
        left: 35px;
        width: 10px;
        height: 10px;
        background: var(--ink);
        box-shadow: 82px 73px 0 -2px #cbd5e1;
      }

      .orbit::after {
        right: 10px;
        bottom: 17px;
        width: 6px;
        height: 6px;
        background: #94a3b8;
      }

      .visual-halo {
        position: absolute;
        inset: 20px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: linear-gradient(145deg, #f8fafc, #eef2f7);
        box-shadow: inset 0 0 0 1px rgba(226, 232, 240, 0.85),
          0 18px 35px rgba(15, 23, 42, 0.08);
      }

      .visual-halo svg {
        width: 48px;
        height: 48px;
        color: var(--ink);
      }

      .sparkle {
        position: absolute;
        color: var(--muted);
      }

      .sparkle-one {
        top: 15px;
        right: 12px;
        width: 17px;
        height: 17px;
      }

      .sparkle-two {
        bottom: 12px;
        left: 12px;
        width: 13px;
        height: 13px;
      }

      .analysis-title {
        position: absolute;
        top: 190px;
        left: 24px;
        width: calc(100% - 48px);
        margin: 0;
        text-align: center;
        font-size: 20px;
        font-weight: 700;
        line-height: 28px;
        letter-spacing: 0.01em;
      }

      .analysis-description {
        position: absolute;
        top: 230px;
        left: 24px;
        width: calc(100% - 48px);
        margin: 0;
        color: var(--muted);
        text-align: center;
        font-size: 14px;
        font-weight: 400;
        line-height: 21px;
        letter-spacing: 0.01em;
      }

      .progress-card {
        position: absolute;
        top: 304px;
        left: 24px;
        width: calc(100% - 48px);
        height: 220px;
        margin: 0;
        padding: 20px;
        list-style: none;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--field);
      }

      .progress-item {
        position: relative;
        min-height: 36px;
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--faint);
        font-size: 14px;
        font-weight: 500;
        line-height: 20px;
      }

      .progress-item + .progress-item {
        margin-top: 12px;
      }

      .progress-item:not(:last-child)::after {
        position: absolute;
        top: 30px;
        left: 13px;
        width: 1px;
        height: 18px;
        background: var(--line);
        content: "";
      }

      .progress-item.is-complete,
      .progress-item.is-active {
        color: var(--ink);
      }

      .progress-icon {
        width: 28px;
        height: 28px;
        display: grid;
        flex: 0 0 28px;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 50%;
        background: var(--white);
        color: var(--faint);
      }

      .is-complete .progress-icon {
        border-color: var(--ink);
        background: var(--ink);
        color: var(--white);
      }

      .is-active .progress-icon {
        border-color: var(--ink);
        color: var(--ink);
      }

      .progress-icon svg {
        width: 14px;
        height: 14px;
      }

      .progress-spinner {
        width: 14px;
        height: 14px;
        border: 2px solid #cbd5e1;
        border-top-color: var(--ink);
        border-radius: 50%;
        animation: rotate 0.85s linear infinite;
      }

      .wait-copy {
        position: absolute;
        top: 558px;
        left: 24px;
        width: calc(100% - 48px);
        text-align: center;
      }

      .wait-copy strong,
      .wait-copy span {
        display: block;
      }

      .wait-copy strong {
        font-size: 15px;
        font-weight: 700;
        line-height: 22px;
      }

      .wait-copy span {
        margin-top: 4px;
        color: var(--faint);
        font-size: 12px;
        font-weight: 400;
        line-height: 18px;
      }

      .cancel-button {
        position: absolute;
        top: 636px;
        left: 20px;
        width: calc(100% - 40px);
        height: 48px;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--white);
        color: var(--muted);
        font-size: 14px;
        font-weight: 600;
        line-height: 20px;
        cursor: pointer;
        transition: background 160ms ease, color 160ms ease;
      }

      .cancel-button:hover {
        background: var(--field);
        color: var(--ink);
      }

      .bottom-tabs {
        position: absolute;
        z-index: 4;
        inset: auto 0 0;
        height: 64px;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        padding: 13px 24px;
        border-top: 1px solid var(--line-soft);
        background: var(--white);
      }

      .tab-button {
        height: 37px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 4px;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--faint);
        cursor: pointer;
      }

      .tab-button svg {
        width: 20px;
        height: 19px;
        flex: 0 0 19px;
      }

      .tab-button span {
        font-size: 10px;
        font-weight: 500;
        line-height: 14px;
      }

      .tab-button.is-active {
        color: var(--ink);
      }

      .tab-button.is-active span {
        font-weight: 700;
      }

      .back-button:focus-visible,
      .cancel-button:focus-visible,
      .tab-button:focus-visible {
        outline: 3px solid rgba(15, 23, 42, 0.16);
        outline-offset: 2px;
      }

      @keyframes rotate {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 360px) {
        .progress-card {
          left: 20px;
          width: calc(100% - 40px);
          padding-right: 14px;
          padding-left: 14px;
        }

        .progress-item {
          font-size: 13px;
        }
      }

      @media (min-height: 878px) {
        .app {
          height: 878px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <button class="back-button" type="button" aria-label="이전 화면으로">
          <svg width="11" height="18" viewBox="0 0 11 18" fill="none" aria-hidden="true">
            <path
              d="M9.5 1.5 2 9l7.5 7.5"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <h1>AI 메뉴 분석</h1>
      </header>

      <main aria-labelledby="analysis-title">
        <div class="analysis-visual" aria-hidden="true">
          <span class="orbit"></span>
          <span class="visual-halo">
            <svg viewBox="0 0 48 48" fill="none">
              <path
                d="M24 5.5c1.3 10.2 8.3 17.3 18.5 18.5C32.3 25.3 25.3 32.3 24 42.5 22.7 32.3 15.7 25.3 5.5 24 15.7 22.7 22.7 15.7 24 5.5Z"
                fill="currentColor"
              />
              <path
                d="M37.5 5.5c.4 3 2.5 5.1 5.5 5.5-3 .4-5.1 2.5-5.5 5.5-.4-3-2.5-5.1-5.5-5.5 3-.4 5.1-2.5 5.5-5.5Z"
                fill="#94A3B8"
              />
            </svg>
          </span>
          <svg class="sparkle sparkle-one" viewBox="0 0 18 18" fill="none">
            <path d="M9 1.5c.5 4.2 3.3 7 7.5 7.5-4.2.5-7 3.3-7.5 7.5C8.5 12.3 5.7 9.5 1.5 9 5.7 8.5 8.5 5.7 9 1.5Z" fill="currentColor" />
          </svg>
          <svg class="sparkle sparkle-two" viewBox="0 0 14 14" fill="none">
            <path d="M7 1c.4 3.3 2.7 5.6 6 6-3.3.4-5.6 2.7-6 6-.4-3.3-2.7-5.6-6-6 3.3-.4 5.6-2.7 6-6Z" fill="currentColor" />
          </svg>
        </div>

        <h2 class="analysis-title" id="analysis-title">최적의 조합을 구성하고 있어요</h2>
        <p class="analysis-description">
          입력하신 조건을 분석하여<br />
          가장 만족스러운 구성을 제안해 드릴게요.
        </p>

        <ol class="progress-card" aria-label="AI 메뉴 분석 진행 상황">
          <li class="progress-item is-complete">
            <span class="progress-icon" aria-hidden="true">
              <svg viewBox="0 0 14 14" fill="none">
                <path d="m2.2 7.2 3.1 3.1 6.5-6.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </span>
            <span>QR코드 스캔 완료</span>
          </li>
          <li class="progress-item is-complete">
            <span class="progress-icon" aria-hidden="true">
              <svg viewBox="0 0 14 14" fill="none">
                <path d="m2.2 7.2 3.1 3.1 6.5-6.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </span>
            <span>인원 및 예산 조건 확인 (3명, 6만원)</span>
          </li>
          <li class="progress-item is-active" aria-current="step">
            <span class="progress-icon" aria-hidden="true">
              <span class="progress-spinner"></span>
            </span>
            <span>'데이트' 컨셉 분석 중...</span>
          </li>
          <li class="progress-item">
            <span class="progress-icon" aria-hidden="true">
              <svg viewBox="0 0 14 14" fill="none">
                <circle cx="7" cy="7" r="2" fill="currentColor" />
              </svg>
            </span>
            <span>최종 리포트 생성</span>
          </li>
        </ol>

        <div class="wait-copy" role="status" aria-live="polite">
          <strong>잠시만 기다려 주세요</strong>
          <span>보통 5~10초 이내에 완료됩니다.</span>
        </div>

        <button class="cancel-button" id="cancel-button" type="button">분석 취소하기</button>
      </main>

      <nav class="bottom-tabs" aria-label="하단 탐색">
        <button class="tab-button is-active" type="button" aria-current="page" data-tab="홈">
          <svg viewBox="0 0 20 19" fill="none" aria-hidden="true">
            <path d="M2 8.2 10 2l8 6.2V17a1 1 0 0 1-1 1h-4.5v-5.6h-5V18H3a1 1 0 0 1-1-1V8.2Z" fill="currentColor" />
          </svg>
          <span>홈</span>
        </button>
        <button class="tab-button" type="button" data-tab="히스토리">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M10 10a3.7 3.7 0 1 0 0-7.4A3.7 3.7 0 0 0 10 10Zm-6.5 7.5c.6-3 3-4.7 6.5-4.7s5.9 1.7 6.5 4.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
          <span>히스토리</span>
        </button>
      </nav>
    </div>

    <script>
      function returnToPreviousStep() {
        if (window.history.length > 1) {
          window.history.back();
          return;
        }

        window.location.href = "STEP6_point.html";
      }

      

      document.querySelector(".back-button").addEventListener("click", returnToPreviousStep);
      document.querySelector("#cancel-button").addEventListener("click", returnToPreviousStep);
    </script>
  </body>
</html>
