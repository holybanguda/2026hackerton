<!doctype html>
<html lang="ko">
  <head>
    <script src="./api.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>진행 중인 추천 (수정) - AI 메뉴 추천</title>
    <style>
      :root {
        --ink: #0f172a;
        --text: #314158;
        --muted: #7f7a76;
        --line: #dedede;
        --line-soft: #f1f5f9;
        --coral: #ff6041;
        --white: #ffffff;
        --field: #f6f4f5;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #61795f; font-family: Inter, Pretendard, "Noto Sans KR", sans-serif; -webkit-font-smoothing: antialiased; }
      body { display: grid; place-items: center; min-height: 100vh; min-height: 100dvh; color: var(--ink); }
      button, input { font: inherit; }
      button { -webkit-tap-highlight-color: transparent; cursor: pointer; }

      .phone-shell {
        position: relative;
        width: min(100vw, 401px);
        height: min(100vh, 874px);
        min-height: 640px;
        overflow: hidden;
        background: var(--white);
        box-shadow: 0 0 0 2px #68a6ff;
      }

      .header {
        position: relative;
        height: 56px;
        padding: 11px 20px;
        display: flex;
        align-items: center;
        gap: 12px;
        border-bottom: 1px solid var(--line);
        background: rgba(255,255,255,0.95);
        backdrop-filter: blur(6px);
        font-size: 18px;
        font-weight: 700;
      }
      .close-button { width: 32px; height: 32px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: var(--ink); font-size: 28px; }
      .header-action { margin-left: auto; border: 0; background: transparent; color: var(--muted); font-size: 14px; font-weight: 500; }

      .content { padding: 0 30px 100px; height: calc(100% - 120px); overflow-y: auto; background: #fff; }

      .current-order-box {
        margin: 0 -30px;
        padding: 20px 30px;
        background: var(--field);
        height: 126px;
      }
      .current-order-header { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
      .current-order-header strong { color: var(--ink); font-weight: 600; font-size: 13px; }
      .current-order-card {
        position: relative;
        margin-top: 10px;
        padding: 0 14px;
        height: 56px;
        display: flex;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        font-size: 14px;
        font-weight: 600;
      }
      .current-order-card img { width: 32px; height: 32px; border-radius: 4px; margin-right: 12px; }
      .current-order-card i { position: absolute; right: 16px; color: #dedede; font-style: normal; font-size: 24px; }

      h3 { margin: 32px 0 16px; font-size: 18px; font-weight: 700; }

      .budget-input-wrap {
        height: 60px;
        padding: 0 16px;
        display: flex;
        align-items: center;
        border-radius: 12px;
        background: #fff5ec;
      }
      .budget-input { flex: 1; border: 0; background: transparent; font-size: 22px; font-weight: 700; color: var(--ink); }
      .budget-unit { font-size: 16px; color: var(--muted); }

      .quick-edit { display: flex; gap: 8px; margin-top: 14px; }
      .quick-edit button {
        height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px;
        background: #fff; color: var(--muted); font-size: 14px; font-weight: 600;
      }

      .people-edit {
        height: 64px;
        padding: 8px 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border: 1px solid var(--line);
        border-radius: 45px;
      }
      .people-btn {
        width: 46px; height: 46px; border: 0; border-radius: 50%;
        background: var(--coral); color: #fff; font-size: 28px; line-height: 1; display: grid; place-items: center;
      }
      .people-btn.minus { background: var(--field); color: var(--muted); }
      .people-count-val { font-size: 20px; font-weight: 700; }

      .edit-tags { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
      .tag-pill {
        height: 32px; padding: 0 14px; display: inline-flex; align-items: center; gap: 6px;
        border: 1px solid var(--coral); border-radius: 32px; background: var(--coral); color: #fff; font-size: 13px; font-weight: 600;
      }
      .tag-pill .remove { cursor: pointer; font-size: 16px; font-weight: 700; }
      .btn-add-tag {
        height: 32px; padding: 0 14px; border: 1px solid var(--line); border-radius: 32px;
        background: #fff; color: #b2afac; font-size: 13px; font-weight: 500;
      }

      .manual-input-box { margin-top: 24px; }
      .manual-input-box label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 8px; }
      .manual-input-box input {
        width: 100%; height: 50px; padding: 0 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--field); font-size: 14px;
      }
      .manual-help { margin-top: 6px; color: #b2afac; font-size: 12px; }

      .spicy-box { margin-top: 28px; }
      .spicy-box p { margin: 0 0 14px; color: #b2afac; font-size: 13px; }
      .edit-range { width: 100%; accent-color: var(--coral); }
      .spicy-ticks { display: flex; justify-content: space-between; margin-top: 12px; color: #b2afac; font-size: 13px; }
      .spicy-ticks b.selected { color: var(--ink); font-weight: 700; }

      .edit-actions { display: flex; gap: 12px; margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--line-soft); }
      .edit-actions button { height: 54px; flex: 1; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--muted); font-size: 15px; font-weight: 700; }
      .edit-actions button.primary { flex: 1.5; border: 0; background: var(--coral); color: #fff; box-shadow: 0 4px 6px rgba(255, 96, 65, 0.25); }

      /* 하단 탭 */
      .bottom-nav {
        position: absolute;
        bottom: 10px;
        left: 10px;
        right: 10px;
        height: 63px;
        padding: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-radius: 154px;
        background: #fff;
        box-shadow: 0 4px 4px rgba(0, 0, 0, 0.18);
      }
      .nav-item {
        position: relative;
        width: 183px;
        height: 47px;
        border: 0;
        background: transparent;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        color: #afa8a8;
        z-index: 1;
      }
      .nav-item.selected { color: #fff; }
      .nav-item.selected::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        border-radius: 32px;
        background: var(--coral);
      }
      .nav-item img { width: 18px; height: 18px; object-fit: contain; }
      .nav-item small { font-size: 10px; line-height: 15px; font-weight: 500; }

      .toast {
        position: fixed; left: 50%; bottom: 85px; transform: translate(-50%, 15px);
        padding: 10px 16px; border-radius: 10px; background: #182235; color: #fff;
        opacity: 0; pointer-events: none; font-size: 12px; transition: 0.2s; z-index: 300; white-space: nowrap;
      }
      .toast.show { opacity: 1; transform: translate(-50%, 0); }

      @media (max-width: 401px) {
        body { place-items: stretch; background: #fff; }
        .phone-shell { width: 100vw; height: 100vh; min-height: 600px; box-shadow: none; }
        .content { padding-right: 18px; padding-left: 18px; }
      }
    </style>
  </head>
  <body>
    <main class="phone-shell">
      <header class="header">
        <button class="close-button" id="btn-close" type="button">✕</button>
        <span>진행 중인 추천</span>
        <button class="header-action" id="btn-end" type="button">추천 종료</button>
      </header>

      <div class="content">
        <div class="current-order-box">
          <div class="current-order-header">
            <span>현재 추천 내역</span>
            <strong id="summary-price">총 58,000원</strong>
          </div>
          <div class="current-order-card">
            <img src="assets/utensils.png" alt="" />
            <span id="summary-title">채끝 등심 스테이크 외 2건</span>
            <i>›</i>
          </div>
        </div>

        <h3>예산 수정</h3>
        <div class="budget-input-wrap">
          <input class="budget-input" id="budget-input" type="text" value="60,000" />
          <span class="budget-unit">원</span>
        </div>
        <div class="quick-edit">
          <button type="button" data-add="5000">+ 5,000원</button>
          <button type="button" data-add="10000">+ 10,000원</button>
          <button type="button" id="btn-budget-custom">직접 입력</button>
        </div>

        <h3>인원 변경</h3>
        <div class="people-edit">
          <button class="people-btn minus" id="btn-people-minus" type="button">−</button>
          <span class="people-count-val" id="people-val">3명</span>
          <button class="people-btn" id="btn-people-plus" type="button">＋</button>
        </div>

        <h3>못 먹는 음식 수정</h3>
        <div class="edit-tags" id="tags-container">
          <span class="tag-pill">오이 <span class="remove">×</span></span>
          <span class="tag-pill">견과류 <span class="remove">×</span></span>
          <button class="btn-add-tag" id="btn-add-tag" type="button">＋ 추가하기</button>
        </div>

        <div class="manual-input-box">
          <label for="custom-input">직접 입력</label>
          <input id="custom-input" type="text" placeholder="예: 오이, 가지, 고수 등" />
          <div class="manual-help">여러 가지인 경우 쉼표(,)로 구분해서 적어주세요.</div>
        </div>

        <h3>매운 음식 선호도</h3>
        <div class="spicy-box">
          <p>일행이 선호하는 맵기 단계를 선택해 주세요.</p>
          <input class="edit-range" id="spice-range" type="range" min="1" max="5" value="3" />
          <div class="spicy-ticks">
            <span>1<br />안매움</span>
            <span>2</span>
            <b class="selected">3</b>
            <span>4</span>
            <span>5<br />아주매움</span>
          </div>
        </div>

        <div class="edit-actions">
          <button id="btn-cancel" type="button">취소</button>
          <button class="primary" id="btn-submit-re-recommend" type="button">수정 완료 및 AI 재추천</button>
        </div>
      </div>

      <!-- 하단 탐색 바 -->
      <nav class="bottom-nav" aria-label="주요 메뉴">
        <button class="nav-item selected" id="nav-home" type="button">
          <img src="assets/nav-home.png" alt="" />
          <small>홈</small>
        </button>
        <button class="nav-item" id="nav-history" type="button">
          <img src="assets/nav-history.png" alt="" />
          <small>히스토리</small>
        </button>
      </nav>
    </main>

    <div id="toast" role="status" aria-live="polite"></div>

    <script>
      const survey = getSurveyData();
      let peopleCount = survey.peopleCount || 3;
      let excludedFoods = survey.excludedFoods || ['오이', '견과류'];

      const budgetInput = document.querySelector('#budget-input');
      const peopleVal = document.querySelector('#people-val');
      const tagsContainer = document.querySelector('#tags-container');
      const toast = document.querySelector('#toast');

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 1800);
      }

      function renderTags() {
        tagsContainer.innerHTML = '';
        excludedFoods.forEach(food => {
          const pill = document.createElement('span');
          pill.className = 'tag-pill';
          pill.textContent = food + ' ';
          const rem = document.createElement('span');
          rem.className = 'remove';
          rem.textContent = '×';
          rem.addEventListener('click', () => {
            excludedFoods = excludedFoods.filter(f => f !== food);
            renderTags();
          });
          pill.append(rem);
          tagsContainer.append(pill);
        });

        const addBtn = document.createElement('button');
        addBtn.className = 'btn-add-tag';
        addBtn.textContent = '＋ 추가하기';
        addBtn.addEventListener('click', () => {
          const val = prompt('제외할 음식을 입력해 주세요:');
          if (val && val.trim()) {
            excludedFoods.push(val.trim());
            renderTags();
          }
        });
        tagsContainer.append(addBtn);
      }

      document.querySelectorAll('[data-add]').forEach(btn => {
        btn.addEventListener('click', () => {
          const cur = Number(budgetInput.value.replace(/\D/g, '')) || 0;
          const add = Number(btn.dataset.add);
          budgetInput.value = (cur + add).toLocaleString('ko-KR');
        });
      });

      document.querySelector('#btn-people-minus').addEventListener('click', () => {
        peopleCount = Math.max(1, peopleCount - 1);
        peopleVal.textContent = `${peopleCount}명`;
      });
      document.querySelector('#btn-people-plus').addEventListener('click', () => {
        peopleCount++;
        peopleVal.textContent = `${peopleCount}명`;
      });

      document.querySelector('#btn-close').addEventListener('click', () => window.location.href = 'STEP8_result.html');
      document.querySelector('#btn-cancel').addEventListener('click', () => window.location.href = 'STEP8_result.html');
      document.querySelector('#btn-end').addEventListener('click', () => window.location.href = 'STEP0_home.html');

      document.querySelector('#btn-submit-re-recommend').addEventListener('click', async () => {
        const newBudget = Number(budgetInput.value.replace(/\D/g, '')) || 60000;
        const newSpice = Number(document.querySelector('#spice-range').value);

        const updatedPayload = {
          ...survey,
          budget: newBudget,
          peopleCount: peopleCount,
          excludedFoods: excludedFoods,
          spicyLevel: newSpice
        };

        saveStepData('peopleCount', peopleCount);
        saveStepData('budget', newBudget);
        saveStepData('excludedFoods', excludedFoods);

        showToast('수정된 조건으로 AI 추천을 재구성합니다.');
        setTimeout(() => {
          window.location.href = 'STEP7_analyze.html';
        }, 600);
      });

      document.querySelector('#nav-home').addEventListener('click', () => window.location.href = 'STEP0_home.html');
      document.querySelector('#nav-history').addEventListener('click', () => window.location.href = 'STEP10_history.html');

      window.addEventListener('DOMContentLoaded', () => {
        peopleVal.textContent = `${peopleCount}명`;
        renderTags();
      });
    </script>
  </body>
</html>
