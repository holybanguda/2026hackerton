<!doctype html>
<html lang="ko">
  <head>
    <script src="./api.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>분위기 선택</title>
    <style>
      :root {
        --ink: #0f172a;
        --text: #314158;
        --muted: #62748e;
        --faint: #90a1b9;
        --line: #e2e8f0;
        --line-soft: #f1f5f9;
        --field: #f8fafc;
        --chevron: #cbd5e1;
        --white: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        place-items: start center;
        background: #eef2f7;
        color: var(--ink);
        font-family: Inter, Pretendard, "Noto Sans KR", -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      button {
        font: inherit;
        -webkit-tap-highlight-color: transparent;
      }

      .app {
        position: relative;
        width: min(100%, 390px);
        min-height: 845px;
        overflow: hidden;
        background: var(--white);
      }

      .header {
        position: absolute;
        z-index: 4;
        inset: 0 0 auto;
        height: 56px;
        display: flex;
        align-items: center;
        padding: 0 16px;
        border-bottom: 1px solid var(--line-soft);
        background: var(--white);
      }

      .back-button {
        width: 32px;
        height: 32px;
        display: grid;
        flex: 0 0 auto;
        place-items: center;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: var(--ink);
        cursor: pointer;
      }

      .back-button:hover,
      .back-button:focus-visible {
        background: var(--field);
      }

      .header h1 {
        margin: 0 0 0 12px;
        font-size: 18px;
        font-weight: 700;
        line-height: 28px;
        letter-spacing: 0.01em;
      }

      main {
        position: absolute;
        inset: 56px 0 auto;
        height: 632px;
      }

      .step-indicator {
        position: absolute;
        top: 16px;
        left: 24px;
        right: 24px;
        height: 4px;
        display: grid;
        grid-template-columns: repeat(8, minmax(0, 1fr));
        gap: 4px;
      }

      .step-indicator span {
        min-width: 0;
        border-radius: 999px;
        background: var(--line-soft);
      }

      .step-indicator span:nth-child(-n + 4) {
        background: var(--ink);
      }

      .intro-title {
        position: absolute;
        top: 38px;
        left: 24px;
        margin: 0;
        font-size: 20px;
        font-weight: 700;
        line-height: 25px;
        letter-spacing: 0.01em;
      }

      .intro-description {
        position: absolute;
        top: 96px;
        left: 24px;
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        font-weight: 400;
        line-height: 20px;
        letter-spacing: 0.01em;
      }

      .mood-form {
        position: absolute;
        top: 134px;
        left: 24px;
        width: calc(100% - 48px);
        height: 474px;
      }

      .mood-card {
        position: absolute;
        left: 0;
        width: 100%;
        height: 78px;
        display: flex;
        align-items: center;
        padding: 0 20px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--white);
        color: var(--ink);
        text-align: left;
        cursor: pointer;
        transition: border-color 160ms ease, background 160ms ease, transform 160ms ease,
          box-shadow 160ms ease;
      }

      .mood-card:nth-child(1) {
        top: 0;
      }

      .mood-card:nth-child(2) {
        top: 98px;
      }

      .mood-card:nth-child(3) {
        top: 196px;
      }

      .mood-card:nth-child(4) {
        top: 294px;
        border-color: var(--chevron);
        background: var(--field);
      }

      .mood-card:hover {
        border-color: #94a3b8;
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
      }

      .mood-card.is-selected {
        border-color: var(--ink);
        background: var(--field);
        box-shadow: 0 0 0 1px var(--ink);
      }

      .mood-icon {
        width: 44px;
        height: 44px;
        display: grid;
        flex: 0 0 auto;
        place-items: center;
        border-radius: 50%;
        background: var(--line-soft);
        color: var(--text);
      }

      .mood-card:nth-child(4) .mood-icon {
        background: var(--white);
        color: var(--muted);
      }

      .mood-icon svg {
        width: 22px;
        height: 22px;
      }

      .mood-copy {
        min-width: 0;
        margin-left: 16px;
      }

      .mood-title,
      .mood-description {
        display: block;
        letter-spacing: 0.01em;
      }

      .mood-title {
        font-size: 16px;
        font-weight: 700;
        line-height: 24px;
      }

      .mood-description {
        color: var(--muted);
        font-size: 14px;
        font-weight: 400;
        line-height: 20px;
        white-space: nowrap;
      }

      .card-chevron {
        width: 10px;
        height: 16px;
        margin-left: auto;
        color: var(--chevron);
      }

      .mood-card:nth-child(4) .card-chevron {
        color: var(--faint);
      }

      .recent-moods {
        position: absolute;
        top: 404px;
        left: 0;
        width: 100%;
        height: 70px;
      }

      .recent-moods h3 {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
        line-height: 20px;
        letter-spacing: 0.01em;
      }

      .recent-buttons {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }

      .recent-button {
        height: 38px;
        padding: 0 15px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--white);
        color: var(--ink);
        font-size: 14px;
        font-weight: 500;
        line-height: 20px;
        letter-spacing: 0.01em;
        cursor: pointer;
        transition: border-color 160ms ease, background 160ms ease, color 160ms ease;
      }

      .recent-button:hover {
        border-color: #94a3b8;
      }

      .recent-button.is-selected {
        border-color: var(--ink);
        background: var(--ink);
        color: var(--white);
      }

      .bottom-actions {
        position: absolute;
        z-index: 3;
        top: 688px;
        left: 0;
        width: 100%;
        height: 93px;
        padding: 20px;
        border-top: 1px solid var(--line-soft);
        background: var(--white);
      }

      .next-button {
        width: 100%;
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 0;
        border: 0;
        border-radius: 12px;
        background: var(--ink);
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1),
          0 4px 6px -4px rgba(0, 0, 0, 0.1);
        color: var(--white);
        font-size: 14px;
        font-weight: 700;
        line-height: 20px;
        letter-spacing: 0.01em;
        cursor: pointer;
        transition: background 160ms ease, transform 160ms ease;
      }

      .next-button:hover {
        background: #1e293b;
        transform: translateY(-1px);
      }

      .bottom-tabs {
        position: absolute;
        z-index: 4;
        inset: auto 0 0;
        height: 64px;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        padding: 13px 24px;
        border-top: 1px solid var(--line-soft);
        background: var(--white);
      }

      .tab-button {
        height: 37px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 4px;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--faint);
        cursor: pointer;
      }

      .tab-button svg {
        width: 20px;
        height: 19px;
        flex: 0 0 19px;
      }

      .tab-button span {
        font-size: 10px;
        font-weight: 500;
        line-height: 14px;
      }

      .tab-button.is-active {
        color: var(--ink);
      }

      .tab-button.is-active span {
        font-weight: 700;
      }

      .toast {
        position: absolute;
        z-index: 6;
        left: 50%;
        bottom: 76px;
        max-width: calc(100% - 40px);
        padding: 10px 14px;
        border-radius: 10px;
        background: rgba(15, 23, 42, 0.92);
        color: var(--white);
        font-size: 13px;
        line-height: 18px;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, 8px);
        transition: opacity 180ms ease, transform 180ms ease;
      }

      .toast.is-visible {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      .back-button:focus-visible,
      .mood-card:focus-visible,
      .recent-button:focus-visible,
      .next-button:focus-visible,
      .tab-button:focus-visible {
        outline: 3px solid rgba(15, 23, 42, 0.16);
        outline-offset: 2px;
      }

      @media (max-width: 360px) {
        .intro-description {
          font-size: 13px;
        }

        .mood-card {
          padding-inline: 16px;
        }

        .mood-copy {
          margin-left: 12px;
        }

        .mood-description {
          font-size: 13px;
        }
      }

      @media (min-height: 845px) {
        .app {
          height: 845px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <button class="back-button" type="button" aria-label="이전 화면으로">
          <svg width="11" height="18" viewBox="0 0 11 18" fill="none" aria-hidden="true">
            <path d="M9.5 1.5 2 9l7.5 7.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <h1>분위기 선택</h1>
      </header>

      <main>
        <div class="step-indicator" aria-label="8단계 중 4단계">
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
        </div>

        <h2 class="intro-title">어떤 분위기로<br />식사할까요?</h2>
        <p class="intro-description">선택한 분위기에 맞춰 장소를 추천해 드려요.</p>

        <form class="mood-form" id="mood-form">
          <button class="mood-card" type="button" data-meeting-type="친구 모임" aria-pressed="false">
            <span class="mood-icon" aria-hidden="true">
              <svg viewBox="0 0 24 22" fill="none">
                <circle cx="9" cy="7" r="3.3" stroke="currentColor" stroke-width="1.7" />
                <circle cx="17.2" cy="8" r="2.6" stroke="currentColor" stroke-width="1.6" />
                <path d="M2.6 19c.6-4 2.8-6 6.4-6s5.8 2 6.4 6M15.2 13.5c3.2-.6 5.4 1 6 4.1" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
              </svg>
            </span>
            <span class="mood-copy">
              <span class="mood-title">친구 모임</span>
              <span class="mood-description">수다와 웃음이 있는 자리</span>
            </span>
            <svg class="card-chevron" viewBox="0 0 10 16" fill="none" aria-hidden="true">
              <path d="m2 1 6 7-6 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>

          <button class="mood-card" type="button" data-meeting-type="데이트" aria-pressed="false">
            <span class="mood-icon" aria-hidden="true">
              <svg viewBox="0 0 22 22" fill="none">
                <path d="M11 18.5C7.5 15.4 3 12.4 3 7.8 3 5.2 4.8 3.5 7.3 3.5c1.6 0 3 1 3.7 2.1.7-1.1 2.1-2.1 3.7-2.1 2.5 0 4.3 1.7 4.3 4.3 0 4.6-4.5 7.6-8 10.7Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </span>
            <span class="mood-copy">
              <span class="mood-title">데이트</span>
              <span class="mood-description">조용하고 분위기 좋은 곳</span>
            </span>
            <svg class="card-chevron" viewBox="0 0 10 16" fill="none" aria-hidden="true">
              <path d="m2 1 6 7-6 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>

          <button class="mood-card" type="button" data-meeting-type="가족 식사" aria-pressed="false">
            <span class="mood-icon" aria-hidden="true">
              <svg viewBox="0 0 22 22" fill="none">
                <path d="m2.5 10 8.5-6.5 8.5 6.5v8a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1v-8Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M8 19v-5.5h6V19M16.5 7V4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </span>
            <span class="mood-copy">
              <span class="mood-title">가족 식사</span>
              <span class="mood-description">모두가 편하게 즐기는 식사</span>
            </span>
            <svg class="card-chevron" viewBox="0 0 10 16" fill="none" aria-hidden="true">
              <path d="m2 1 6 7-6 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>

          <button class="mood-card" type="button" data-meeting-type="직접 입력" aria-pressed="false">
            <span class="mood-icon" aria-hidden="true">
              <svg viewBox="0 0 22 22" fill="none">
                <path d="m4 15.8-.8 3 3-.8L17.7 6.5a2.1 2.1 0 0 0-3-3L4 15.8Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                <path d="m13.2 5 3.8 3.8M3.5 19h15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              </svg>
            </span>
            <span class="mood-copy">
              <span class="mood-title">직접 입력</span>
              <span class="mood-description">다른 분위기를 원하시나요?</span>
            </span>
            <svg class="card-chevron" viewBox="0 0 10 16" fill="none" aria-hidden="true">
              <path d="m2 1 6 7-6 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>

          <section class="recent-moods" aria-labelledby="recent-title">
            <h3 id="recent-title">최근 선택</h3>
            <div class="recent-buttons">
              <button class="recent-button" type="button" data-meeting-type="소개팅">소개팅</button>
              <button class="recent-button" type="button" data-meeting-type="회식">회식</button>
              <button class="recent-button" type="button" data-meeting-type="가족 행사">가족 행사</button>
            </div>
          </section>
        </form>
      </main>

      <div class="bottom-actions">
        <button class="next-button" id="next-button" type="button">
          <span>다음 단계로</span>
          <svg width="12" height="14" viewBox="0 0 12 14" fill="none" aria-hidden="true">
            <path d="m1.5 2 5 5-5 5M6 7h4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>

      <nav class="bottom-tabs" aria-label="하단 탐색">
        <button class="tab-button is-active" type="button" aria-current="page" data-tab="홈">
          <svg viewBox="0 0 20 19" fill="none" aria-hidden="true">
            <path d="M2 8.2 10 2l8 6.2V17a1 1 0 0 1-1 1h-4.5v-5.6h-5V18H3a1 1 0 0 1-1-1V8.2Z" fill="currentColor" />
          </svg>
          <span>홈</span>
        </button>
        <button class="tab-button" type="button" data-tab="히스토리">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M10 10a3.7 3.7 0 1 0 0-7.4A3.7 3.7 0 0 0 10 10Zm-6.5 7.5c.6-3 3-4.7 6.5-4.7s5.9 1.7 6.5 4.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
          <span>히스토리</span>
        </button>
      </nav>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>

    <script>
      const moodCards = [...document.querySelectorAll(".mood-card")];
      const recentButtons = [...document.querySelectorAll(".recent-button")];
      const toast = document.querySelector("#toast");
      let meetingType = "";
      let toastTimer;

      function selectMeetingType(meetingTypeValue, source) {
        meetingType = meetingTypeValue;
        moodCards.forEach((card) => card.setAttribute("aria-invalid", "false"));
        moodCards.forEach((card) => {
          const selected = card === source;
          card.classList.toggle("is-selected", selected);
          card.setAttribute("aria-pressed", String(selected));
        });
        recentButtons.forEach((button) => {
          const selected = button === source;
          button.classList.toggle("is-selected", selected);
          button.setAttribute("aria-pressed", String(selected));
        });
      }

      function showToast(message) {
        window.clearTimeout(toastTimer);
        toast.textContent = message;
        toast.classList.add("is-visible");
        toastTimer = window.setTimeout(() => toast.classList.remove("is-visible"), 1800);
      }

      moodCards.forEach((card) => {
        card.addEventListener("click", () => selectMeetingType(card.dataset.meetingType, card));
      });

      recentButtons.forEach((button) => {
        button.setAttribute("aria-pressed", "false");
        button.addEventListener("click", () => selectMeetingType(button.dataset.meetingType, button));
      });

      document.querySelector(".back-button").addEventListener("click", () => {
        window.location.href = "STEP3_budget.html";
      });

      document.querySelector("#next-button").addEventListener("click", () => {
        if (!meetingType) {
          showToast("분위기를 선택해 주세요.");
          moodCards.forEach((card) => card.setAttribute("aria-invalid", "true"));
          moodCards[0].focus();
          return;
        }

        sessionStorage.setItem("meetingType", meetingType);
        if (typeof saveStepData === 'function') {
          saveStepData('meetingType', selectedVibe);
        }
        showToast(`${meetingType} 분위기를 선택했어요.`);
        
        window.location.href = "STEP5_app.html";

        // POST /api/recommendation 요청 필드: meetingType
      });

    </script>
  </body>
</html>
